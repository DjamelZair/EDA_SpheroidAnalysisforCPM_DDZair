  </defs>
  <rect width="1200" height="540" fill="#ffffff"/>
  <text x="600" y="34" text-anchor="middle" font-size="22" font-weight="600" fill="#0f172a">Why feature-fidelity validation matters</text>
  <text x="600" y="56" text-anchor="middle" font-size="13" fill="#64748b">Pipeline view of the CLL spheroid segmentation audit (RQ1, this notebook)</text>
  <rect x="20" y="80" width="270" height="130" rx="8" ry="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="155" y="110" text-anchor="middle" font-size="11" font-weight="500" fill="#64748b">Stage 1</text>
  <text x="155" y="138" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">Brightfield microscopy</text>
  <text x="155" y="158" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">image</text>
  <text x="155" y="188" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">960 x 1280 IncuCyte JPG</text>
  <path d="M 290 145 L 312 145" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <rect x="315" y="80" width="270" height="130" rx="8" ry="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2.2"/>
  <text x="450" y="110" text-anchor="middle" font-size="11" font-weight="600" fill="#2563eb">Stage 2  -  audited here</text>
  <text x="450" y="138" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">Segmentation model</text>
  <text x="450" y="168" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">8 candidates: nnU-Net, SAM2,</text>
  <text x="450" y="184" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">U-Net, classical, pseudo-label,</text>
  <text x="450" y="200" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">multichannel, postproc variants</text>
  <path d="M 585 145 L 607 145" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <rect x="610" y="80" width="270" height="130" rx="8" ry="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="745" y="110" text-anchor="middle" font-size="11" font-weight="500" fill="#64748b">Stage 3</text>
  <text x="745" y="138" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">6 morphological features</text>
  <text x="745" y="165" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">area, equivalent diameter,</text>
  <text x="745" y="181" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">eccentricity, solidity,</text>
  <text x="745" y="197" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">perimeter, circularity</text>
  <path d="M 880 145 L 902 145" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <rect x="905" y="80" width="275" height="130" rx="8" ry="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="1042" y="110" text-anchor="middle" font-size="11" font-weight="500" fill="#64748b">Stage 4</text>
  <text x="1042" y="138" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">CPM parameter matching</text>
  <text x="1042" y="158" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">(RQ3)</text>
  <text x="1042" y="188" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">the actual research goal</text>
  <path d="M 450 210 L 450 235" stroke="#2563eb" stroke-width="1.6" fill="none"/>
  <circle cx="450" cy="237" r="3" fill="#2563eb"/>
  <rect x="220" y="245" width="460" height="44" rx="22" ry="22" fill="#f8fafc" stroke="#2563eb" stroke-width="1.4"/>
  <text x="450" y="264" text-anchor="middle" font-size="11" font-weight="600" fill="#2563eb">Evaluation gap</text>
  <text x="450" y="281" text-anchor="middle" font-size="13" font-weight="500" fill="#0f172a">Pixel Dice does not predict feature reproducibility</text>
  <path d="M 320 289 C 280 320 230 350 200 380" stroke="#9ca3af" stroke-width="1.8" fill="none" marker-end="url(#arrowGray)"/>
  <rect x="222" y="320" width="120" height="20" rx="4" ry="4" fill="#ffffff" opacity="0.95"/>
  <text x="282" y="334" text-anchor="middle" font-size="11" font-weight="500" fill="#334155">pixel Dice  /  CC-Dice</text>
  <path d="M 580 289 C 620 320 670 350 720 380" stroke="#2563eb" stroke-width="2.2" fill="none" marker-end="url(#arrowAccent)"/>
  <rect x="640" y="318" width="240" height="22" rx="4" ry="4" fill="#ffffff" opacity="0.95"/>
  <text x="760" y="333" text-anchor="middle" font-size="11" font-weight="600" fill="#2563eb">ICC(3,1)  +  CCC  +  sigma_seg / sigma_bio</text>
  <rect x="80" y="390" width="240" height="80" rx="8" ry="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="200" y="416" text-anchor="middle" font-size="14" font-weight="600" fill="#334155">Mask quality</text>
  <text x="200" y="437" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">overlap with GT,</text>
  <text x="200" y="453" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">fragment matching</text>
  <text x="200" y="380" text-anchor="middle" font-size="10" font-weight="500" fill="#64748b">insufficient on its own</text>
  <rect x="600" y="390" width="320" height="80" rx="8" ry="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="760" y="416" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Feature reproducibility</text>
  <text x="760" y="437" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">ICC and CCC versus literature cutoffs;</text>
  <text x="760" y="453" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">sigma_seg vs sigma_bio per feature</text>
  <text x="760" y="380" text-anchor="middle" font-size="10" font-weight="600" fill="#2563eb">this notebook</text>
  <text x="760" y="495" text-anchor="middle" font-size="11" font-weight="400" fill="#64748b">Sources: Yu et al. 2024 (J Nucl Med) | Carre et al. 2022 (Sci Rep) | Zwanenburg et al. 2020 (Radiology / IBSI)</text>
  <text x="760" y="514" text-anchor="middle" font-size="10" font-weight="400" fill="#94a3b8">doi 10.2967/jnumed.123.266018  |  doi 10.1038/s41598-022-20703-9  |  IBSI standard</text>
</svg>